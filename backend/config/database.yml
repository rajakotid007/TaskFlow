default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "taskflow") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "taskflow") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>

development:
  <<: *default
  database: taskflow_development

test:
  <<: *default
  database: taskflow_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "taskflow_production") %>
